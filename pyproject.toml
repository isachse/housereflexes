[project]
name = "housereflexes"
version = "0.1.0"
description = "housereflexes: automatic reactions to PV surplus and other house vitals, carried out through the housevitals control API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
housereflexes = "housereflexes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/housereflexes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
